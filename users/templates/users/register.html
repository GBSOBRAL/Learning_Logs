{% extends "learning_logs/base.html" %}

{% block title %}Criar conta - Learning Log{% endblock title %}

{% block content %}
    <div class="page-head">
        <h1>Criar conta</h1>
    </div>

    <form action="{% url 'register' %}" method="post" class="form">
        {% csrf_token %}
        {% include "learning_logs/_fields.html" %}

        <input type="hidden" name="next" value="{% url 'index' %}">

        <div class="actions">
            <button type="submit" name="submit" class="btn">Criar conta</button>
        </div>

        <p class="form__alt">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
    </form>
{% endblock content %}
