{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="anotações, anotação">
    <meta name="description" content="Aplicação para anotações.">
    <meta name="author" content="Gustavo Sobral">

    <title>{% block title %}Learning Log{% endblock title %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'learning_logs/style.css' %}">
</head>
<body>
    <header class="topbar">
        <div class="topbar__inner">
            <a class="brand" href="{% url 'index' %}">Learning Log</a>

            <nav class="nav" aria-label="Principal">
                {% if user.is_authenticated %}
                    <a href="{% url 'topics' %}">Tópicos</a>
                    <span class="nav__user">{{ user.username }}</span>
                    <a href="{% url 'logout' %}">Sair</a>
                {% else %}
                    <a href="{% url 'login' %}">Entrar</a>
                    <a href="{% url 'register' %}">Criar conta</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="page">
        {% block header %}{% endblock header %}
        {% block content %}{% endblock content %}
    </main>

    <dialog id="confirm-dialog" class="confirm" aria-labelledby="confirm-message">
        <p id="confirm-message" data-confirm-message></p>
        <div class="actions">
            <button type="button" class="btn btn--ghost" data-confirm-cancel>Cancelar</button>
            <button type="button" class="btn btn--danger" data-confirm-accept>Excluir</button>
        </div>
    </dialog>

    <script src="{% static 'learning_logs/app.js' %}" defer></script>
</body>
</html>
